name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Préparer le fichier d'environnement
        run: cp .env.example .env
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
